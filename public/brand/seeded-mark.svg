<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="title">
  <title id="title">Seeded</title>
  <!-- The ring follows the page (dark ink on light, light ink on dark); the
       seams sit on the lime ball, which is light in both, so they stay dark.
       Same as components/seeded/icons SeededMark. -->
  <style>
    .ring { stroke: #14181A; }
    .seams { stroke: #14181A; }
    @media (prefers-color-scheme: dark) { .ring { stroke: #ECEDE7; } }
  </style>
  <g transform="translate(1 1)">
    <circle class="ring" cx="11" cy="11" r="10" fill="#D7F25A" />
    <path class="seams" d="M3 8c5 2 11 2 16 0M3 14c5-2 11-2 16 0" />
  </g>
</svg>
