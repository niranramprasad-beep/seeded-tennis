<svg xmlns="http://www.w3.org/2000/svg" width="142" height="40" viewBox="0 0 142 40" role="img" aria-labelledby="title">
  <title id="title">Seeded</title>
  <!-- Light-on-dark aware: the ring and wordmark switch to the light ink in a
       dark colour scheme (they were #14181A only, invisible on a dark page);
       the seams stay dark on the lime ball in both. -->
  <style>
    .ink { stroke: #14181A; }
    .word { fill: #14181A; }
    @media (prefers-color-scheme: dark) { .ink { stroke: #ECEDE7; } .word { fill: #ECEDE7; } }
  </style>
  <g transform="translate(1 9)" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle class="ink" cx="11" cy="11" r="10" fill="#D7F25A" />
    <path stroke="#14181A" d="M3 8c5 2 11 2 16 0M3 14c5-2 11-2 16 0" />
  </g>
  <text class="word" x="32" y="30" font-family="'Inter Tight', sans-serif" font-size="30" font-weight="700">Seeded</text>
</svg>
